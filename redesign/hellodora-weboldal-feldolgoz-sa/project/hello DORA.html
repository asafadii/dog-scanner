document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" cy=\"18.5\" rx=\"6.6\" ry=\"5.6\"><\u002Fellipse><circle cx=\"5.6\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"10.6\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"17.4\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"22.4\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span style=\"flex:1\"><span style=\"display:block;font-weight:600;font-size:15px;color:#1A2420\">Mochi<\u002Fspan><span style=\"display:block;font-size:13px;color:#8a8f86\">Boarding, Day 2 of stay<\u002Fspan><\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#8a8f86;letter-spacing:.04em\">B-04<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;padding:16px 24px;border-top:1px solid #EEF1ED\"><span style=\"width:40px;height:40px;border-radius:50%;background:#EAF4F0;display:inline-flex;align-items:center;justify-content:center\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 28 28\" fill=\"#0B7A6F\"><ellipse cx=\"14\" cy=\"18.5\" rx=\"6.6\" ry=\"5.6\"><\u002Fellipse><circle cx=\"5.6\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"10.6\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"17.4\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"22.4\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span style=\"flex:1\"><span style=\"display:block;font-weight:600;font-size:15px;color:#1A2420\">Pepper<\u002Fspan><span style=\"display:block;font-size:13px;color:#8a8f86\">Medication<\u002Fspan><\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#8a8f86;letter-spacing:.04em\">C-07<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;padding:16px 24px;border-top:1px solid #EEF1ED\"><span style=\"width:40px;height:40px;border-radius:50%;background:#EAF4F0;display:inline-flex;align-items:center;justify-content:center\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 28 28\" fill=\"#0B7A6F\"><ellipse cx=\"14\" cy=\"18.5\" rx=\"6.6\" ry=\"5.6\"><\u002Fellipse><circle cx=\"5.6\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"10.6\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"17.4\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"22.4\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span style=\"flex:1\"><span style=\"display:block;font-weight:600;font-size:15px;color:#1A2420\">Nova<\u002Fspan><span style=\"display:block;font-size:13px;color:#8a8f86\">Daycare<\u002Fspan><\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#8a8f86;letter-spacing:.04em\">A-03<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HOW IT WORKS -->\n  <div style=\"max-width:1100px;margin:0 auto;padding:100px 44px\">\n    <div style=\"text-align:center\"><div style=\"color:#0B7A6F;font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase\">How it works<\u002Fdiv>\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4.6vw,58px);color:#1A2420;margin:14px 0 64px;line-height:1.05\">From booking to checkout in <span style=\"font-style:italic;color:#0B7A6F\">five steps<\u002Fspan><\u002Fh2><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:90px 1fr;gap:28px;align-items:baseline;padding:26px 0;border-top:1px solid #ECEEE9\"><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#9BD2C6;line-height:1\">01<\u002Fspan><div><h3 style=\"font-family:'Instrument Serif',serif;font-size:25px;font-weight:400;color:#1A2420;margin:0 0 5px\">Create accounts<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#6E726B\">Owners create accounts and add their dogs.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:90px 1fr;gap:28px;align-items:baseline;padding:26px 0;border-top:1px solid #ECEEE9\"><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#9BD2C6;line-height:1\">02<\u002Fspan><div><h3 style=\"font-family:'Instrument Serif',serif;font-size:25px;font-weight:400;color:#1A2420;margin:0 0 5px\">Book online<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#6E726B\">Owners book daycare or boarding online.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:90px 1fr;gap:28px;align-items:baseline;padding:26px 0;border-top:1px solid #ECEEE9\"><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#9BD2C6;line-height:1\">03<\u002Fspan><div><h3 style=\"font-family:'Instrument Serif',serif;font-size:25px;font-weight:400;color:#1A2420;margin:0 0 5px\">Check in with QR<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#6E726B\">Staff check dogs in using QR codes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:90px 1fr;gap:28px;align-items:baseline;padding:26px 0;border-top:1px solid #ECEEE9\"><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#9BD2C6;line-height:1\">04<\u002Fspan><div><h3 style=\"font-family:'Instrument Serif',serif;font-size:25px;font-weight:400;color:#1A2420;margin:0 0 5px\">Manage the stay<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#6E726B\">Manage stays, kennel assignments and payments.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:90px 1fr;gap:28px;align-items:baseline;padding:26px 0;border-top:1px solid #ECEEE9;border-bottom:1px solid #ECEEE9\"><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#9BD2C6;line-height:1\">05<\u002Fspan><div><h3 style=\"font-family:'Instrument Serif',serif;font-size:25px;font-weight:400;color:#1A2420;margin:0 0 5px\">Report &amp; grow<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#6E726B\">Generate reports and grow your business.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PRICING -->\n  <div style=\"background:#F4F9F7;border-top:1px solid #ECEEE9\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:100px 44px;text-align:center\">\n      <div style=\"color:#0B7A6F;font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase\">Pricing<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4.6vw,58px);color:#1A2420;margin:14px 0 48px;line-height:1.05\">Simple, <span style=\"font-style:italic;color:#0B7A6F\">transparent<\u002Fspan> plans<\u002Fh2>\n      <div style=\"max-width:420px;margin:0 auto;position:relative;background:#fff;border:1px solid #DDE6E1;border-radius:24px;padding:42px 38px 38px;box-shadow:0 30px 60px -38px rgba(20,50,40,.3);text-align:left\">\n        <span style=\"position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#0B7A6F;color:#fff;font-size:12px;font-weight:600;padding:7px 18px;border-radius:999px;letter-spacing:.04em\">Most popular<\u002Fspan>\n        <div style=\"text-align:center\"><div style=\"font-size:14px;font-weight:600;color:#8a8f86;letter-spacing:.04em;text-transform:uppercase\">Starter<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:44px;color:#0B7A6F;margin:8px 0 0;line-height:1\">Custom pricing<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin:30px 0 0;display:flex;flex-direction:column;gap:15px\">\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:15.5px;color:#3a3f38\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A6F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 12 9 17 20 6\"><\u002Fpolyline><\u002Fsvg>Online bookings<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:15.5px;color:#3a3f38\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A6F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 12 9 17 20 6\"><\u002Fpolyline><\u002Fsvg>Dog profiles<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:15.5px;color:#3a3f38\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A6F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 12 9 17 20 6\"><\u002Fpolyline><\u002Fsvg>Check-ins<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:15.5px;color:#3a3f38\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A6F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 12 9 17 20 6\"><\u002Fpolyline><\u002Fsvg>Payments<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:15.5px;color:#3a3f38\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A6F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 12 9 17 20 6\"><\u002Fpolyline><\u002Fsvg>Reporting<\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"#1c\" style=\"display:block;text-align:center;text-decoration:none;margin:32px 0 0;color:#fff;background:#0B7A6F;font-weight:600;font-size:16px;padding:16px;border-radius:999px\" style-hover=\"background:#0a6a60\">Contact sales<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FAQ -->\n  <div style=\"max-width:820px;margin:0 auto;padding:100px 44px\">\n    <div style=\"text-align:center\"><div style=\"color:#0B7A6F;font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase\">FAQ<\u002Fdiv>\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4.6vw,58px);color:#1A2420;margin:14px 0 44px;line-height:1.05\">Common questions<\u002Fh2><\u002Fdiv>\n    <div>\n      <div style=\"padding:26px 4px;border-top:1px solid #ECEEE9\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#1A2420\">How does owner check-in work?<\u002Fspan><span style=\"color:#0B7A6F;font-size:20px;flex:none\">–<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:16px;line-height:1.66;color:#6E726B;max-width:680px\">Owners receive a secure QR code tied to their booking. On arrival, staff scan it to instantly check the dog in, assign a kennel, and surface any notes like medication or first-visit flags.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px 4px;border-top:1px solid #ECEEE9;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#1A2420\">Can I manage boarding and daycare?<\u002Fspan><span style=\"color:#b7bcb2;font-size:22px;flex:none\">+<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:26px 4px;border-top:1px solid #ECEEE9;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#1A2420\">Can I export reports?<\u002Fspan><span style=\"color:#b7bcb2;font-size:22px;flex:none\">+<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:26px 4px;border-top:1px solid #ECEEE9;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#1A2420\">Can multiple staff members use DORA?<\u002Fspan><span style=\"color:#b7bcb2;font-size:22px;flex:none\">+<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:26px 4px;border-top:1px solid #ECEEE9;border-bottom:1px solid #ECEEE9;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#1A2420\">Can I migrate from spreadsheets?<\u002Fspan><span style=\"color:#b7bcb2;font-size:22px;flex:none\">+<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CTA -->\n  <div style=\"position:relative;background:#0B3F39;overflow:hidden\">\n    <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.06\"><svg width=\"420\" height=\"420\" viewBox=\"0 0 28 28\" fill=\"#fff\"><ellipse cx=\"14\" cy=\"18.5\" rx=\"6.6\" ry=\"5.6\"><\u002Fellipse><circle cx=\"5.6\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"10.6\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"17.4\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"22.4\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:relative;max-width:820px;margin:0 auto;padding:108px 44px;text-align:center\">\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,5.4vw,68px);color:#fff;margin:0;line-height:1.04\">Run your daycare,<br><span style=\"font-style:italic;color:#9BD2C6\">not your paperwork.<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.65;color:#a9ccc4;margin:24px auto 0;max-width:540px\">Everything you need to manage dogs, bookings, boarding, and payments in one place.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center;margin:38px 0 0\">\n        <a href=\"#1c\" style=\"text-decoration:none;color:#0B3F39;background:#fff;font-weight:600;font-size:16px;padding:16px 30px;border-radius:999px\" style-hover=\"transform:translateY(-2px)\">Staff signup<\u002Fa>\n        <a href=\"#1c\" style=\"text-decoration:none;color:#fff;font-weight:600;font-size:16px;border-bottom:1.5px solid rgba(255,255,255,.6);padding-bottom:3px\">Owner signup<\u002Fa>\n        <a href=\"#1c\" style=\"text-decoration:none;color:#a9ccc4;font-weight:500;font-size:16px;display:inline-flex;align-items:center;gap:6px\">Book a Demo <span style=\"font-size:17px\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"background:#fff\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:56px 44px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #ECEEE9\">\n      <div style=\"max-width:300px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#0B7A6F\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 28 28\" fill=\"#fff\"><ellipse cx=\"14\" cy=\"18.5\" rx=\"6.6\" ry=\"5.6\"><\u002Fellipse><circle cx=\"5.6\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"10.6\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"17.4\" cy=\"7.4\" r=\"2.6\"><\u002Fcircle><circle cx=\"22.4\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#1A2420\"><span style=\"font-style:italic;color:#0B7A6F\">hello<\u002Fspan> DORA<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:14.5px;color:#8a8f86\">The operating system for dog daycares.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:34px;font-size:14.5px;font-weight:500\">\n        <a href=\"#1c\" style=\"text-decoration:none;color:#4a4f48\">Features<\u002Fa>\n        <a href=\"#1c\" style=\"text-decoration:none;color:#4a4f48\">Pricing<\u002Fa>\n        <a href=\"#1c\" style=\"text-decoration:none;color:#4a4f48\">Privacy<\u002Fa>\n        <a href=\"#1c\" style=\"text-decoration:none;color:#4a4f48\">Terms<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1240px;margin:0 auto;padding:20px 44px;font-size:13px;color:#a3a89f\">© 2026 hello DORA. All rights reserved.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<!--APPEND-VARIANTS-HERE-->\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
